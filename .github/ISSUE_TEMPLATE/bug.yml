name: Bug report
description: Something produces the wrong expression or results, or throws
labels: [bug]
body:
    - type: textarea
      id: what
      attributes:
          label: What happened, and what did you expect?
      validations:
          required: true
    - type: textarea
      id: repro
      attributes:
          label: Minimal reproduction
          description: The classes involved and the few lines that build and apply the filter. If you can, include the expression it should have produced.
          render: csharp
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Package and version
          placeholder: TopMarksDevelopment.ExpressionBuilder 1.0.0-rc.1
      validations:
          required: true
    - type: input
      id: provider
      attributes:
          label: Where the filter runs
          description: In memory (LINQ to Objects), or the EF Core provider and version
