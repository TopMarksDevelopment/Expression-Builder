name: Nuget Push CI

on:
    release:
        types:
            - published

    # Allow manual runs
    workflow_dispatch:

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Test
              run: dotnet test --configuration Release --no-build --verbosity normal

            # Every packable project in src/ (the tests, sample, tools and generator are not packable)
            - name: Create the packages
              run: dotnet pack --configuration Release --no-build

            - name: Publish Nuget
              run: dotnet nuget push **/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: packages
                  path: "**/Release/*.nupkg"
